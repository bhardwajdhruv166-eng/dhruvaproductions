<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dhruva Productions</title>
</head>
<body>
    <header>
        <a href="index.html">
            <img src="../multimedia/Dhruva.png" alt="Home" width="200" height="150">
        </a>
        <h1>Login here</h1>
        <hr>
    </header>

    <main>
        <section id="login-form">
            <form action="#" method="post">
                <fieldset>
                    <legend><strong>Login Information</strong></legend>
                   
                        <label for="Username">Username:</label><br />
                        <input 
                            type="text" 
                            id="Username" 
                            name="Username"
                            placeholder="Enter your Username" 
                            required 
                            autocomplete="username" 
                            minlength="3" 
                            maxlength="20" 
                            size="30"
                        />
                    
                    <p>
                        <label for="Password">Password:</label><br />
                        <input 
                            type="password" 
                            id="Password" 
                            name="Password"
                            placeholder="Enter your Password" 
                            required 
                            autocomplete="current-password" 
                            minlength="3" 
                            maxlength="20" 
                            size="30"
                        />
                    </p>

                    <input type="submit" id="submit" value="Login" />
                </fieldset>
            </form>
            
        </section>
    </main>

    <footer>
        <!-- Copyright removed as requested -->
    </footer>
</body>
</html>
