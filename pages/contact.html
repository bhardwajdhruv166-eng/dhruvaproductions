<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Dhruva Productions</title>
</head>
<body>
    <header>
        <a href="index.html">
            <img src="../multimedia/Dhruva.png" alt="Home" width="200" height="150">
        </a>
        <h1>Contact Details</h1>
        <p>For inquiries, you can reach us via email or phone:</p>
        <address>
            <p>Email: <a href="mailto:info@dhruvaproductions.com">info@dhruvaproductions.com</a></p>
            <p>Phone: <a href="tel:+91971444852">+91-971444852</a></p>
        </address>
        <hr>
    </header>

    <main>
        <!-- Location Section -->
        <section id="map">
            <h2>Location Map</h2>
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6997.318253776257!2d77.04664269332497!3d28.72973140244697!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390d065948743b3d%3A0x80fa3401d248a17b!2sJain%20Nagar%20Extension%2C%20Sector%2038%2C%20Rohini%2C%20Delhi!5e0!3m2!1sen!2sin!4v1775746256234!5m2!1sen!2sin" 
                width="600" 
                height="450" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </section>

        <hr>

        <!-- Feedback Form Section -->
        <section id="feedback-form">
            <form action="#" method="post">
                <fieldset>
                    <legend><strong>Feedback Form</strong></legend>
                    
                    <p>
                        <label for="name">Name:</label><br>
                        <input type="text" id="name" name="name" placeholder="Your Name" required>
                    </p>

                    <p>
                        <label for="email">Email:</label><br>
                        <input type="email" id="email" name="email" placeholder="email@example.com" required>
                    </p>

                    <p>
                        <label for="subject">Subject:</label><br>
                        <input type="text" id="subject" name="subject" required>
                    </p>

                    <p>
                        <label for="message">Message:</label><br>
                        <textarea id="message" name="message" rows="4" cols="40" required></textarea>
                    </p>

                    <button type="submit">Submit Feedback</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Dhruva Productions. All rights reserved.</p>
    </footer>
</body>
</html>
